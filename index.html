<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESUMEN DE MAQUINARIA HORAS Y COMBUSTIBLE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #f59e0b;
      --accent-text: #0f172a;
      --badge-bg: #fef3c7;
      --badge-text: #b45309;
      --badge-border: #fcd34d;
      --danger: #dc2626;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span.badge {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #bbf7d0;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    button.btn-refresh {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: background 0.2s;
    }

    button.btn-refresh:hover {
      background: var(--surface-hover);
    }

    /* Controls & Filters */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    select {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .period-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .period-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-tabs button.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .kpi-card .label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .kpi-card .value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Chart Card */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .chart-header h2 {
      grid-column: 2;
      text-align: center;
      text-transform: uppercase;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #0f172a;
    }

    .date-tag {
      grid-column: 3;
      justify-self: end;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    @media (max-width: 820px) {
      .chart-header {
        display: flex;
        flex-direction: column;
        text-align: center;
      }
      .date-tag {
        justify-self: center;
      }
    }

    .chart-wrapper {
      position: relative;
      height: 500px;
      width: 100%;
    }

    #loader {
      text-align: center;
      padding: 40px;
      color: #d97706;
      font-weight: 600;
    }

    #errorBox {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Control de Maquinaria <span class="badge">EN VIVO</span></h1>
      </div>
      <div class="status-bar">
        <span id="lastUpdate">Cargando datos...</span>
        <button class="btn-refresh" onclick="fetchSheetData()">↻ Actualizar</button>
      </div>
    </header>

    <div id="errorBox"></div>
    <div id="loader">Conectando con Google Sheets y procesando registros...</div>

    <div id="dashboardContent" style="display: none;">
      <!-- Filtros: Vista Temporal + Fecha (al inicio) + Lugar + Equipo -->
      <div class="controls-panel">
        <div class="control-group">
          <label>Vista Temporal</label>
          <div class="period-tabs" id="periodTabs">
            <button data-period="daily" class="active">Diario</button>
            <button data-period="weekly">Semanal</button>
            <button data-period="monthly">Mensual</button>
          </div>
        </div>

        <div class="control-group">
          <label for="filterFecha">Fecha</label>
          <select id="filterFecha"></select>
        </div>

        <div class="control-group">
          <label for="filterLugar">Lugar / Frente</label>
          <select id="filterLugar"><option value="ALL">Todos los lugares</option></select>
        </div>

        <div class="control-group">
          <label for="filterEquipo">Equipo (Orden de Flota)</label>
          <select id="filterEquipo"><option value="ALL">Todos los equipos</option></select>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="label" id="kpiHorasLabel">Total Horas Trabajadas</div>
          <div class="value" id="kpiHoras">0.0 h</div>
        </div>
        <div class="kpi-card">
          <div class="label" id="kpiCombLabel">Combustible Col. M</div>
          <div class="value" id="kpiCombustible">0.0 Gal</div>
        </div>
        <div class="kpi-card">
          <div class="label">Equipos Activos (con horas &gt; 0)</div>
          <div class="value" id="kpiEquipos">0</div>
        </div>
        <div class="kpi-card">
          <div class="label">Alertas Mantenimiento (&lt; 50h)</div>
          <div class="value" id="kpiAlertasMtto">0</div>
        </div>
      </div>

      <!-- Gráfico Único -->
      <div class="chart-card">
        <div class="chart-header">
          <h2 id="mainChartTitle">RESUMEN DIARIO DE MAQUINARIA HORAS Y COMBUSTIBLE</h2>
          <span class="date-tag" id="activeScopeBadge">-</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="mainTimeChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1YL5wIhK9Po-Je5P96Nm0m4cqiLqx0FrhiRCttU3wA7Y';
    const GID = '1193959640';
    const CSV_EXPORT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    // Paleta de colores diferenciada por vista temporal
    const PERIOD_THEMES = {
      daily: {
        title: 'RESUMEN DIARIO DE MAQUINARIA HORAS Y COMBUSTIBLE',
        barColor: '#f59e0b',
        axisLeftColor: '#d97706',
        lineColor: '#0284c7',
        lineBg: 'rgba(2, 132, 199, 0.15)',
        tabBg: '#f59e0b',
        tabText: '#0f172a',
        badgeBg: '#fef3c7',
        badgeText: '#b45309',
        badgeBorder: '#fcd34d'
      },
      weekly: {
        title: 'RESUMEN SEMANAL DE MAQUINARIA HORAS Y COMBUSTIBLE',
        barColor: '#10b981',
        axisLeftColor: '#059669',
        lineColor: '#6366f1',
        lineBg: 'rgba(99, 102, 241, 0.15)',
        tabBg: '#10b981',
        tabText: '#ffffff',
        badgeBg: '#d1fae5',
        badgeText: '#065f46',
        badgeBorder: '#6ee7b7'
      },
      monthly: {
        title: 'RESUMEN MENSUAL DE MAQUINARIA HORAS Y COMBUSTIBLE',
        barColor: '#2563eb',
        axisLeftColor: '#1d4ed8',
        lineColor: '#e11d48',
        lineBg: 'rgba(225, 29, 72, 0.15)',
        tabBg: '#2563eb',
        tabText: '#ffffff',
        badgeBg: '#dbeafe',
        badgeText: '#1e40af',
        badgeBorder: '#93c5fd'
      }
    };

    const ORDEN_EQUIPOS = [
      'Excavadora 1 (336 D2L)',
      'Excavadora 2 (320)',
      'Excavadora 3 (336 DL)',
      'Excavadora 4 (PC210 K)',
      'Cargador F. (CAT)',
      'Cargador F. (KOMATSU)',
      'Retro Excavadora (Jhon Deere)',
      'Retro Excavadora (Cat)',
      'Tractor Oruga',
      'Motoniveladora (GD555-5)',
      'Rodillo 1 (CS533E CAT)',
      'Rodillo 3 (CS533C CAT)',
      'Mixer',
      'Mini Cargador (Manitou)',
      'Rodillo Rolas',
      'Rodillo Neumático 3',
      'Pavimentadora 3'
    ];

    function cleanSpaces(str) {
      return String(str || '')
        .replace(/[\u00A0\u200B-\u200D\uFEFF]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    const ORDEN_MAP = new Map(
      ORDEN_EQUIPOS.map((nombre, index) => [cleanSpaces(nombre).toLowerCase(), index])
    );

    function normalizeEquipoName(rawName) {
      const clean = cleanSpaces(rawName);
      if (!clean) return 'Sin Especificar';
      const lower = clean.toLowerCase();

      if (lower.includes('cargador f') && lower.includes('cat')) return 'Cargador F. (CAT)';
      if (lower.includes('cargador f') && lower.includes('komatsu')) return 'Cargador F. (KOMATSU)';
      if (lower === 'pavimentadora 2' || lower === 'pavimentadora 3') return 'Pavimentadora 3';

      const found = ORDEN_EQUIPOS.find(o => cleanSpaces(o).toLowerCase() === lower);
      return found || clean;
    }

    function getEquipoOrderIndex(equipoName) {
      const key = cleanSpaces(normalizeEquipoName(equipoName)).toLowerCase();
      return ORDEN_MAP.has(key) ? ORDEN_MAP.get(key) : 9999;
    }

    function compareEquipos(a, b) {
      const idxA = getEquipoOrderIndex(a);
      const idxB = getEquipoOrderIndex(b);
      if (idxA !== idxB) return idxA - idxB;
      return String(a).localeCompare(String(b));
    }

    let rawRows = [];
    let currentPeriod = 'daily';
    let charts = {};

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cur);
            cur = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
          } else {
            cur += ch;
          }
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function parseNum(val) {
      if (val === null || val === undefined) return 0;
      let str = cleanSpaces(val);
      if (!str) return 0;

      if (str.includes('.') && str.includes(',')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else {
        str = str.replace(',', '.');
      }

      const match = str.match(/-?\d+(\.\d+)?/);
      if (!match) return 0;
      const num = parseFloat(match[0]);
      return isNaN(num) ? 0 : num;
    }

    function parseFechaStr(rawStr) {
      const str = cleanSpaces(rawStr);
      if (!str) return null;
      const parts = str.split('/');
      if (parts.length === 3) {
        const d = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const y = parseInt(parts[2], 10);
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
          return new Date(y, m, d);
        }
      }
      return null;
    }

    function formatDateISO(dateObj) {
      if (!dateObj || isNaN(dateObj)) return '';
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateES(dateObj) {
      if (!dateObj || isNaN(dateObj)) return '-';
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const y = dateObj.getFullYear();
      return `${d}/${m}/${y}`;
    }

    async function fetchSheetData() {
      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('errorBox');
      const content = document.getElementById('dashboardContent');

      loader.style.display = 'block';
      errorBox.style.display = 'none';

      try {
        const res = await fetch(`${CSV_EXPORT_URL}&t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const matrix = parseCSV(csvText);

        if (matrix.length < 2) {
          throw new Error('La hoja no contiene suficientes filas.');
        }

        // Columnas: A(0):LUGAR, B(1):AÑO, C(2):SEM, D(3):MES, E(4):FECHA, F(5):CODIGO, G(6):OPERADOR, H(7):EQUIPO,
        // I(8):H.INICIAL, J(9):H.FINAL, K(10):TOTAL, L(11):HORAS RESTANTES MTTO, M(12):COMBUSTIBLE ABASTECIDO
        rawRows = matrix.slice(1).map(cols => {
          const getCol = (idx) => cleanSpaces(cols[idx] || '');
          const fechaObj = parseFechaStr(getCol(4));
          const anio = getCol(1) || (fechaObj ? String(fechaObj.getFullYear()) : '');
          const sem = getCol(2); // Columna C
          const mes = getCol(3); // Columna D
          const mttoRaw = getCol(11);

          return {
            lugar: getCol(0) || 'SIN DATA',
            anio: anio,
            sem: sem,
            mes: mes,
            fechaObj: fechaObj,
            fechaISO: formatDateISO(fechaObj),
            fechaStr: formatDateES(fechaObj),
            codigo: getCol(5),
            operador: getCol(6),
            equipo: normalizeEquipoName(getCol(7)),
            totalHoras: parseNum(getCol(10)),                     // Columna K
            horasRestantesMtto: mttoRaw !== '' ? parseNum(mttoRaw) : null, // Columna L
            combustible: parseNum(getCol(12))                     // Columna M
          };
        }).filter(row => row.codigo && row.codigo.toUpperCase() !== 'CODIGO');

        populateFilterOptions();
        updateDashboard();

        loader.style.display = 'none';
        content.style.display = 'block';
        document.getElementById('lastUpdate').textContent = `Actualizado: ${new Date().toLocaleTimeString()} (${rawRows.length} filas)`;
      } catch (err) {
        loader.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = `<strong>Error al cargar Google Sheets:</strong> ${err.message}.<br>Verifica que la hoja tenga permisos de lectura ("Cualquier persona con el enlace puede ver").`;
      }
    }

    function populateFilterOptions() {
      // 1. Filtro de Fecha: todas las fechas únicas ordenadas de la más reciente a la más antigua
      const dateMap = new Map();
      rawRows.forEach(r => {
        if (r.fechaISO && !dateMap.has(r.fechaISO)) {
          dateMap.set(r.fechaISO, {
            iso: r.fechaISO,
            str: r.fechaStr,
            sem: r.sem,
            mes: r.mes
          });
        }
      });

      const sortedDates = [...dateMap.values()].sort((a, b) => b.iso.localeCompare(a.iso));
      const fechaSel = document.getElementById('filterFecha');
      const prevFecha = fechaSel.value;
      fechaSel.innerHTML = '';

      sortedDates.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = d.iso;
        opt.textContent = idx === 0 ? `${d.str} (Última)` : d.str;
        fechaSel.appendChild(opt);
      });

      if (prevFecha && dateMap.has(prevFecha)) {
        fechaSel.value = prevFecha;
      } else if (sortedDates.length > 0) {
        fechaSel.value = sortedDates[0].iso; // Predeterminado: última fecha
      }

      // 2. Filtro de Lugar y Equipo
      const fillSelect = (id, values, defaultLabel, customSort = null) => {
        const sel = document.getElementById(id);
        const current = sel.value;
        sel.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
        const unique = [...new Set(values)].filter(Boolean);
        if (customSort) {
          unique.sort(customSort);
        } else {
          unique.sort();
        }
        unique.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          sel.appendChild(opt);
        });
        if ([...sel.options].some(o => o.value === current)) sel.value = current;
      };

      fillSelect('filterLugar', rawRows.map(r => r.lugar), 'Todos los lugares');
      fillSelect('filterEquipo', [...ORDEN_EQUIPOS, ...rawRows.map(r => r.equipo)], 'Todos los equipos', compareEquipos);
    }

    function applyThemeColors(theme) {
      document.documentElement.style.setProperty('--accent', theme.tabBg);
      document.documentElement.style.setProperty('--accent-text', theme.tabText);
      document.documentElement.style.setProperty('--badge-bg', theme.badgeBg);
      document.documentElement.style.setProperty('--badge-text', theme.badgeText);
      document.documentElement.style.setProperty('--badge-border', theme.badgeBorder);
    }

    function updateDashboard() {
      const theme = PERIOD_THEMES[currentPeriod];
      applyThemeColors(theme);

      const selectedFechaISO = document.getElementById('filterFecha').value;
      const selectedLugar = document.getElementById('filterLugar').value;
      const selectedEquipo = document.getElementById('filterEquipo').value;

      // Buscar referencia de la fecha elegida para conocer su Semana (Col. C), Mes (Col. D) y Año (Col. B)
      const refRow = rawRows.find(r => r.fechaISO === selectedFechaISO) || rawRows[0] || {};
      const targetFechaStr = refRow.fechaStr || '-';
      const targetSem = refRow.sem || '';
      const targetMes = refRow.mes || '';
      const targetAnio = refRow.anio || '';

      // Filtrado por Lugar y Equipo
      const baseFiltered = rawRows.filter(r => {
        if (selectedLugar !== 'ALL' && r.lugar !== selectedLugar) return false;
        if (selectedEquipo !== 'ALL' && r.equipo !== selectedEquipo) return false;
        return true;
      });

      // Filtrado temporal según Diario (Fecha E), Semanal (Columna C) o Mensual (Columna D)
      let activeData = [];
      let scopeLabel = targetFechaStr;

      if (currentPeriod === 'daily') {
        activeData = baseFiltered.filter(r => r.fechaISO === selectedFechaISO);
        scopeLabel = targetFechaStr;
        document.getElementById('kpiHorasLabel').textContent = `Horas Trabajadas (${targetFechaStr})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${targetFechaStr})`;
      } else if (currentPeriod === 'weekly') {
        activeData = baseFiltered.filter(r => {
          const sameSem = cleanSpaces(r.sem) === cleanSpaces(targetSem);
          const sameAnio = !targetAnio || !r.anio || r.anio === targetAnio;
          return sameSem && sameAnio;
        });
        scopeLabel = `Semana ${targetSem}${targetAnio ? ' - ' + targetAnio : ''}`;
        document.getElementById('kpiHorasLabel').textContent = `Horas Acumuladas (${scopeLabel})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${scopeLabel})`;
      } else {
        const mesCap = targetMes ? targetMes.charAt(0).toUpperCase() + targetMes.slice(1).toLowerCase() : '-';
        activeData = baseFiltered.filter(r => {
          const sameMes = cleanSpaces(r.mes).toLowerCase() === cleanSpaces(targetMes).toLowerCase();
          const sameAnio = !targetAnio || !r.anio || r.anio === targetAnio;
          return sameMes && sameAnio;
        });
        scopeLabel = `${mesCap}${targetAnio ? ' ' + targetAnio : ''}`;
        document.getElementById('kpiHorasLabel').textContent = `Horas Acumuladas (${scopeLabel})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${scopeLabel})`;
      }

      document.getElementById('mainChartTitle').textContent = theme.title;
      document.getElementById('activeScopeBadge').textContent = scopeLabel;

      // KPIs
      const totalHoras = activeData.reduce((acc, r) => acc + r.totalHoras, 0);
      const totalComb = activeData.reduce((acc, r) => acc + r.combustible, 0);
      const activeRows = activeData.filter(r => r.totalHoras > 0);
      const uniqueActiveMachines = new Set(activeRows.map(r => r.codigo)).size;

      const latestByMachine = {};
      baseFiltered.forEach(r => {
        const key = `${r.equipo}__${r.codigo}`;
        if (!latestByMachine[key] || (r.fechaObj && (!latestByMachine[key].fechaObj || r.fechaObj >= latestByMachine[key].fechaObj))) {
          latestByMachine[key] = r;
        }
      });
      const machineStatuses = Object.values(latestByMachine);
      const alertasMtto = machineStatuses.filter(m => m.horasRestantesMtto !== null && m.horasRestantesMtto <= 50).length;

      document.getElementById('kpiHoras').textContent = `${totalHoras.toLocaleString('es-PE', { maximumFractionDigits: 1 })} h`;
      document.getElementById('kpiCombustible').textContent = `${totalComb.toLocaleString('es-PE', { maximumFractionDigits: 1 })} Gal`;
      document.getElementById('kpiEquipos').textContent = uniqueActiveMachines;
      document.getElementById('kpiAlertasMtto').textContent = alertasMtto;

      renderMainChart(activeData, theme, selectedEquipo);
    }

    // Plugin para mostrar valores numéricos encima de cada barra y punto
    const valueLabelsPlugin = {
      id: 'valueLabelsPlugin',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const theme = PERIOD_THEMES[currentPeriod];
        ctx.save();
        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.5;

        chart.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chart.getDatasetMeta(datasetIndex);
          if (meta.hidden) return;

          meta.data.forEach((element, index) => {
            const val = dataset.data[index];
            if (!val || val <= 0) return;

            const text = Number.isInteger(val) ? String(val) : val.toFixed(1);
            if (dataset.type === 'line') {
              ctx.strokeText(`${text}g`, element.x, element.y - 10);
              ctx.fillStyle = theme.lineColor;
              ctx.fillText(`${text}g`, element.x, element.y - 10);
            } else {
              ctx.strokeText(text, element.x, element.y - 6);
              ctx.fillStyle = '#0f172a';
              ctx.fillText(text, element.x, element.y - 6);
            }
          });
        });
        ctx.restore();
      }
    };

    // Renderiza siempre las 17 máquinas en el orden oficial (tanto en Diario, Semanal y Mensual)
    function renderMainChart(data, theme, selectedEquipo) {
      if (charts.main) charts.main.destroy();
      const ctx = document.getElementById('mainTimeChart').getContext('2d');

      const statsByEquipo = new Map();
      if (selectedEquipo === 'ALL') {
        ORDEN_EQUIPOS.forEach(eq => statsByEquipo.set(eq, { horas: 0, combustible: 0 }));
      } else {
        statsByEquipo.set(selectedEquipo, { horas: 0, combustible: 0 });
      }

      data.forEach(r => {
        const officialName = normalizeEquipoName(r.equipo);
        if (!statsByEquipo.has(officialName)) {
          statsByEquipo.set(officialName, { horas: 0, combustible: 0 });
        }
        const entry = statsByEquipo.get(officialName);
        entry.horas += r.totalHoras;
        entry.combustible += r.combustible;
      });

      const ordered = [...statsByEquipo.entries()]
        .filter(([name, val]) => selectedEquipo !== 'ALL' || ORDEN_MAP.has(cleanSpaces(name).toLowerCase()) || val.horas > 0 || val.combustible > 0)
        .sort((a, b) => compareEquipos(a[0], b[0]));

      charts.main = new Chart(ctx, {
        type: 'bar',
        plugins: [valueLabelsPlugin],
        data: {
          labels: ordered.map(e => e[0]),
          datasets: [
            {
              label: 'Horas Trabajadas (h)',
              data: ordered.map(e => Number(e[1].horas.toFixed(1))),
              backgroundColor: theme.barColor,
              borderRadius: 6,
              order: 2,
              yAxisID: 'y'
            },
            {
              label: 'Combustible Abastecido (Gal)',
              data: ordered.map(e => Number(e[1].combustible.toFixed(1))),
              type: 'line',
              borderColor: theme.lineColor,
              backgroundColor: theme.lineBg,
              borderWidth: 3,
              borderDash: [10, 6],
              tension: 0.35,
              pointRadius: 4.5,
              pointHoverRadius: 6.5,
              pointBackgroundColor: theme.lineColor,
              fill: false,
              order: 1,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 26, bottom: 4 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#0f172a',
                font: { size: 12, weight: '600' },
                padding: 22,
                usePointStyle: true
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: '#1e293b',
                font: { size: 11, weight: '500' },
                autoSkip: false,
                maxRotation: 45,
                minRotation: 30
              },
              grid: { color: 'rgba(148, 163, 184, 0.25)' }
            },
            y: {
              type: 'linear',
              position: 'left',
              beginAtZero: true,
              grace: '12%',
              title: { display: true, text: 'Horas (h)', color: theme.axisLeftColor, font: { weight: '700' } },
              ticks: { color: '#475569' },
              grid: { color: 'rgba(148, 163, 184, 0.25)' }
            },
            y1: {
              type: 'linear',
              position: 'right',
              beginAtZero: true,
              grace: '12%',
              title: { display: true, text: 'Combustible (Gal)', color: theme.lineColor, font: { weight: '700' } },
              ticks: { color: '#475569' },
              grid: { drawOnChartArea: false }
            }
          }
        }
      });
    }

    // Event Listeners
    document.querySelectorAll('#periodTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#periodTabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPeriod = btn.dataset.period;
        updateDashboard();
      });
    });

    ['filterFecha', 'filterLugar', 'filterEquipo'].forEach(id => {
      document.getElementById(id).addEventListener('change', updateDashboard);
    });

    // Inicializar
    fetchSheetData();
  </script>
</body>
</html>
