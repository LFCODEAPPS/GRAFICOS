<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESUMEN DE MAQUINARIA HORAS Y COMBUSTIBLE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #f59e0b;
      --accent-text: #0f172a;
      --badge-bg: #fef3c7;
      --badge-text: #b45309;
      --badge-border: #fcd34d;
      --danger: #dc2626;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span.badge {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #bbf7d0;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    button.btn-refresh {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: background 0.2s;
    }

    button.btn-refresh:hover {
      background: var(--surface-hover);
    }

    /* Controls & Filters */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    select {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .period-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .period-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-tabs button.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    /* KPI Cards (3 columnas principales) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .kpi-card .label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .kpi-card .value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Chart Card */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .chart-header h2 {
      grid-column: 2;
      text-align: center;
      text-transform: uppercase;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #0f172a;
    }

    .date-tag {
      grid-column: 3;
      justify-self: end;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    @media (max-width: 820px) {
      .chart-header {
        display: flex;
        flex-direction: column;
        text-align: center;
      }
      .date-tag {
        justify-self: center;
      }
    }

    .chart-wrapper {
      position: relative;
      height: 550px;
      width: 100%;
    }

    #loader {
      text-align: center;
      padding: 40px;
      color: #d97706;
      font-weight: 600;
    }

    #errorBox {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Control de Maquinaria <span class="badge">EN VIVO</span></h1>
      </div>
      <div class="status-bar">
        <span id="lastUpdate">Cargando datos...</span>
        <button class="btn-refresh" onclick="fetchSheetData()">↻ Actualizar</button>
      </div>
    </header>

    <div id="errorBox"></div>
    <div id="loader">Conectando con Google Sheets y procesando registros...</div>

    <div id="dashboardContent" style="display: none;">
      <!-- Filtros: Vista Temporal + Selector Dinámico (Fecha / Semana / Mes) + Lugar + Equipo -->
      <div class="controls-panel">
        <div class="control-group">
          <label>Vista Temporal</label>
          <div class="period-tabs" id="periodTabs">
            <button data-period="daily" class="active">Diario</button>
            <button data-period="weekly">Semanal</button>
            <button data-period="monthly">Mensual</button>
          </div>
        </div>

        <div class="control-group">
          <label for="filterTemporal" id="filterTemporalLabel">FECHA</label>
          <select id="filterTemporal"></select>
        </div>

        <div class="control-group">
          <label for="filterLugar">Lugar / Frente</label>
          <select id="filterLugar"><option value="ALL">Todos los lugares</option></select>
        </div>

        <div class="control-group">
          <label for="filterEquipo">Equipo (Orden de Flota)</label>
          <select id="filterEquipo"><option value="ALL">Todos los equipos</option></select>
        </div>
      </div>

      <!-- KPIs (3 indicadores principales) -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="label" id="kpiHorasLabel">Total Horas Trabajadas</div>
          <div class="value" id="kpiHoras">0.0 h</div>
        </div>
        <div class="kpi-card">
          <div class="label" id="kpiCombLabel">Combustible Col. M</div>
          <div class="value" id="kpiCombustible">0.0 Gal</div>
        </div>
        <div class="kpi-card">
          <div class="label">Equipos Activos (con horas &gt; 0)</div>
          <div class="value" id="kpiEquipos">0</div>
        </div>
      </div>

      <!-- Gráfico Único -->
      <div class="chart-card">
        <div class="chart-header">
          <h2 id="mainChartTitle">RESUMEN DIARIO DE MAQUINARIA HORAS Y COMBUSTIBLE</h2>
          <span class="date-tag" id="activeScopeBadge">-</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="mainTimeChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1YL5wIhK9Po-Je5P96Nm0m4cqiLqx0FrhiRCttU3wA7Y';
    const GID = '1193959640';
    const CSV_EXPORT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    const PERIOD_THEMES = {
      daily: {
        title: 'RESUMEN DIARIO DE MAQUINARIA HORAS Y COMBUSTIBLE',
        selectorLabel: 'FECHA',
        flagColors: [
          '#f59e0b', // Ámbar
          '#0d9488', // Verde azulado
          '#ea580c', // Naranja intenso
          '#2563eb', // Azul real
          '#7c3aed', // Violeta
          '#65a30d', // Verde lima
          '#e11d48', // Carmesí
          '#0891b2'  // Cian
        ],
        axisLeftColor: '#d97706',
        lineColor: '#0284c7',
        lineBg: 'rgba(2, 132, 199, 0.15)',
        tabBg: '#f59e0b',
        tabText: '#0f172a',
        badgeBg: '#fef3c7',
        badgeText: '#b45309',
        badgeBorder: '#fcd34d'
      },
      weekly: {
        title: 'RESUMEN SEMANAL DE MAQUINARIA HORAS Y COMBUSTIBLE',
        selectorLabel: 'SEMANA',
        flagColors: [
          '#10b981', // Esmeralda
          '#f59e0b', // Ámbar
          '#4f46e5', // Índigo
          '#e11d48', // Carmesí
          '#06b6d4', // Turquesa
          '#f97316', // Naranja
          '#8b5cf6', // Púrpura
          '#14b8a6'  // Teal
        ],
        axisLeftColor: '#059669',
        lineColor: '#6366f1',
        lineBg: 'rgba(99, 102, 241, 0.15)',
        tabBg: '#10b981',
        tabText: '#ffffff',
        badgeBg: '#d1fae5',
        badgeText: '#065f46',
        badgeBorder: '#6ee7b7'
      },
      monthly: {
        title: 'RESUMEN MENSUAL DE MAQUINARIA HORAS Y COMBUSTIBLE',
        selectorLabel: 'MES',
        flagColors: [
          '#2563eb', // Azul cobalto
          '#f59e0b', // Ámbar dorado
          '#059669', // Verde bosque
          '#e11d48', // Rojo carmesí
          '#7c3aed', // Violeta
          '#ea580c', // Naranja
          '#0891b2', // Cian
          '#c026d3'  // Fucsia
        ],
        axisLeftColor: '#1d4ed8',
        lineColor: '#e11d48',
        lineBg: 'rgba(225, 29, 72, 0.15)',
        tabBg: '#2563eb',
        tabText: '#ffffff',
        badgeBg: '#dbeafe',
        badgeText: '#1e40af',
        badgeBorder: '#93c5fd'
      }
    };

    const MESES_ORDEN = {
      'enero': 1, 'febrero': 2, 'marzo': 3, 'abril': 4,
      'mayo': 5, 'junio': 6, 'julio': 7, 'agosto': 8,
      'septiembre': 9, 'setiembre': 9, 'octubre': 10, 'noviembre': 11, 'diciembre': 12
    };

    const ORDEN_EQUIPOS = [
      'Excavadora 1 (336 D2L)',
      'Excavadora 2 (320)',
      'Excavadora 3 (336 DL)',
      'Excavadora 4 (PC210 K)',
      'Cargador F. (CAT)',
      'Cargador F. (KOMATSU)',
      'Retro Excavadora (Jhon Deere)',
      'Retro Excavadora (Cat)',
      'Tractor Oruga',
      'Motoniveladora (GD555-5)',
      'Rodillo 1 (CS533E CAT)',
      'Rodillo 3 (CS533C CAT)',
      'Mixer',
      'Mini Cargador (Manitou)',
      'Rodillo Rolas',
      'Rodillo Neumático 3',
      'Pavimentadora 3'
    ];

    function cleanSpaces(str) {
      return String(str || '')
        .replace(/[\u00A0\u200B-\u200D\uFEFF]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    const ORDEN_MAP = new Map(
      ORDEN_EQUIPOS.map((nombre, index) => [cleanSpaces(nombre).toLowerCase(), index])
    );

    function normalizeEquipoName(rawName) {
      const clean = cleanSpaces(rawName);
      if (!clean) return 'Sin Especificar';
      const lower = clean.toLowerCase();

      if (lower.includes('cargador f') && lower.includes('cat')) return 'Cargador F. (CAT)';
      if (lower.includes('cargador f') && lower.includes('komatsu')) return 'Cargador F. (KOMATSU)';
      if (lower === 'pavimentadora 2' || lower === 'pavimentadora 3') return 'Pavimentadora 3';

      const found = ORDEN_EQUIPOS.find(o => cleanSpaces(o).toLowerCase() === lower);
      return found || clean;
    }

    function getEquipoOrderIndex(equipoName) {
      const key = cleanSpaces(normalizeEquipoName(equipoName)).toLowerCase();
      return ORDEN_MAP.has(key) ? ORDEN_MAP.get(key) : 9999;
    }

    function compareEquipos(a, b) {
      const idxA = getEquipoOrderIndex(a);
      const idxB = getEquipoOrderIndex(b);
      if (idxA !== idxB) return idxA - idxB;
      return String(a).localeCompare(String(b));
    }

    let rawRows = [];
    let allLugares = [];
    let currentPeriod = 'daily';
    let charts = {};

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cur);
            cur = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
          } else {
            cur += ch;
          }
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function parseNum(val) {
      if (val === null || val === undefined) return 0;
      let str = cleanSpaces(val);
      if (!str) return 0;

      if (str.includes('.') && str.includes(',')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else {
        str = str.replace(',', '.');
      }

      const match = str.match(/-?\d+(\.\d+)?/);
      if (!match) return 0;
      const num = parseFloat(match[0]);
      return isNaN(num) ? 0 : num;
    }

    function parseFechaStr(rawStr) {
      const str = cleanSpaces(rawStr);
      if (!str) return null;
      const parts = str.split('/');
      if (parts.length === 3) {
        const d = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const y = parseInt(parts[2], 10);
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
          return new Date(y, m, d);
        }
      }
      return null;
    }

    function formatDateISO(dateObj) {
      if (!dateObj || isNaN(dateObj)) return '';
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateES(dateObj) {
      if (!dateObj || isNaN(dateObj)) return '-';
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const y = dateObj.getFullYear();
      return `${d}/${m}/${y}`;
    }

    async function fetchSheetData() {
      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('errorBox');
      const content = document.getElementById('dashboardContent');

      loader.style.display = 'block';
      errorBox.style.display = 'none';

      try {
        const res = await fetch(`${CSV_EXPORT_URL}&t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const matrix = parseCSV(csvText);

        if (matrix.length < 2) {
          throw new Error('La hoja no contiene suficientes filas.');
        }

        // A(0):LUGAR, B(1):AÑO, C(2):SEM, D(3):MES, E(4):FECHA, F(5):CODIGO, G(6):OPERADOR, H(7):EQUIPO,
        // I(8):H.INICIAL, J(9):H.FINAL, K(10):TOTAL, L(11):MTTO, M(12):COMBUSTIBLE ABASTECIDO
        rawRows = matrix.slice(1).map(cols => {
          const getCol = (idx) => cleanSpaces(cols[idx] || '');
          const fechaObj = parseFechaStr(getCol(4));
          const anio = getCol(1) || (fechaObj ? String(fechaObj.getFullYear()) : '');
          const sem = getCol(2);
          const mes = getCol(3);

          return {
            lugar: getCol(0) || 'SIN DATA',
            anio: anio,
            sem: sem,
            mes: mes,
            fechaObj: fechaObj,
            fechaISO: formatDateISO(fechaObj),
            fechaStr: formatDateES(fechaObj),
            codigo: getCol(5),
            operador: getCol(6),
            equipo: normalizeEquipoName(getCol(7)),
            totalHoras: parseNum(getCol(10)), // Columna K
            combustible: parseNum(getCol(12)) // Columna M
          };
        }).filter(row => row.codigo && row.codigo.toUpperCase() !== 'CODIGO');

        allLugares = [...new Set(rawRows.map(r => r.lugar).filter(Boolean))].sort();

        populateStaticFilters();
        populateTemporalSelector(true);
        updateDashboard();

        loader.style.display = 'none';
        content.style.display = 'block';
        document.getElementById('lastUpdate').textContent = `Actualizado: ${new Date().toLocaleTimeString()} (${rawRows.length} filas)`;
      } catch (err) {
        loader.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = `<strong>Error al cargar Google Sheets:</strong> ${err.message}.<br>Verifica que la hoja tenga permisos de lectura ("Cualquier persona con el enlace puede ver").`;
      }
    }

    function populateStaticFilters() {
      const fillSelect = (id, values, defaultLabel, customSort = null) => {
        const sel = document.getElementById(id);
        const current = sel.value;
        sel.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
        const unique = [...new Set(values)].filter(Boolean);
        if (customSort) {
          unique.sort(customSort);
        } else {
          unique.sort();
        }
        unique.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          sel.appendChild(opt);
        });
        if ([...sel.options].some(o => o.value === current)) sel.value = current;
      };

      fillSelect('filterLugar', allLugares, 'Todos los lugares');
      fillSelect('filterEquipo', [...ORDEN_EQUIPOS, ...rawRows.map(r => r.equipo)], 'Todos los equipos', compareEquipos);
    }

    function populateTemporalSelector(preserveSelection = false) {
      const theme = PERIOD_THEMES[currentPeriod];
      document.getElementById('filterTemporalLabel').textContent = theme.selectorLabel;

      const sel = document.getElementById('filterTemporal');
      const prevValue = preserveSelection ? sel.value : '';
      sel.innerHTML = '';

      if (currentPeriod === 'daily') {
        const dateMap = new Map();
        rawRows.forEach(r => {
          if (r.fechaISO && !dateMap.has(r.fechaISO)) {
            dateMap.set(r.fechaISO, r.fechaStr);
          }
        });
        const sortedDates = [...dateMap.entries()].sort((a, b) => b[0].localeCompare(a[0]));
        sortedDates.forEach(([iso, str], idx) => {
          const opt = document.createElement('option');
          opt.value = iso;
          opt.textContent = idx === 0 ? `${str} (Última)` : str;
          sel.appendChild(opt);
        });
      } else if (currentPeriod === 'weekly') {
        const weekMap = new Map();
        rawRows.forEach(r => {
          if (!r.sem) return;
          const key = `${r.anio}||${r.sem}`;
          if (!weekMap.has(key)) {
            const semNum = parseInt(String(r.sem).replace(/\D/g, ''), 10) || 0;
            const anioNum = parseInt(r.anio, 10) || 0;
            weekMap.set(key, {
              key,
              anio: r.anio,
              sem: r.sem,
              sortWeight: anioNum * 100 + semNum
            });
          }
        });
        const sortedWeeks = [...weekMap.values()].sort((a, b) => b.sortWeight - a.sortWeight);
        sortedWeeks.forEach((w, idx) => {
          const opt = document.createElement('option');
          opt.value = w.key;
          const baseText = `Semana ${w.sem}${w.anio ? ' - ' + w.anio : ''}`;
          opt.textContent = idx === 0 ? `${baseText} (Última)` : baseText;
          sel.appendChild(opt);
        });
      } else {
        const monthMap = new Map();
        rawRows.forEach(r => {
          if (!r.mes) return;
          const mesLower = cleanSpaces(r.mes).toLowerCase();
          const key = `${r.anio}||${mesLower}`;
          if (!monthMap.has(key)) {
            const mNum = MESES_ORDEN[mesLower] || 0;
            const anioNum = parseInt(r.anio, 10) || 0;
            const mesCap = r.mes.charAt(0).toUpperCase() + r.mes.slice(1).toLowerCase();
            monthMap.set(key, {
              key,
              label: `${mesCap}${r.anio ? ' ' + r.anio : ''}`,
              sortWeight: anioNum * 100 + mNum
            });
          }
        });
        const sortedMonths = [...monthMap.values()].sort((a, b) => b.sortWeight - a.sortWeight);
        sortedMonths.forEach((m, idx) => {
          const opt = document.createElement('option');
          opt.value = m.key;
          opt.textContent = idx === 0 ? `${m.label} (Último)` : m.label;
          sel.appendChild(opt);
        });
      }

      if (prevValue && [...sel.options].some(o => o.value === prevValue)) {
        sel.value = prevValue;
      } else if (sel.options.length > 0) {
        sel.selectedIndex = 0;
      }
    }

    function applyThemeColors(theme) {
      document.documentElement.style.setProperty('--accent', theme.tabBg);
      document.documentElement.style.setProperty('--accent-text', theme.tabText);
      document.documentElement.style.setProperty('--badge-bg', theme.badgeBg);
      document.documentElement.style.setProperty('--badge-text', theme.badgeText);
      document.documentElement.style.setProperty('--badge-border', theme.badgeBorder);
    }

    function updateDashboard() {
      const theme = PERIOD_THEMES[currentPeriod];
      applyThemeColors(theme);

      const selectedTemporal = document.getElementById('filterTemporal').value;
      const selectedLugar = document.getElementById('filterLugar').value;
      const selectedEquipo = document.getElementById('filterEquipo').value;

      const baseFiltered = rawRows.filter(r => {
        if (selectedLugar !== 'ALL' && r.lugar !== selectedLugar) return false;
        if (selectedEquipo !== 'ALL' && r.equipo !== selectedEquipo) return false;
        return true;
      });

      let activeData = [];
      let scopeLabel = '-';

      if (currentPeriod === 'daily') {
        activeData = baseFiltered.filter(r => r.fechaISO === selectedTemporal);
        const ref = rawRows.find(r => r.fechaISO === selectedTemporal);
        scopeLabel = ref ? ref.fechaStr : selectedTemporal;
        document.getElementById('kpiHorasLabel').textContent = `Horas Trabajadas (${scopeLabel})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${scopeLabel})`;
      } else if (currentPeriod === 'weekly') {
        const [targetAnio, targetSem] = selectedTemporal.split('||');
        activeData = baseFiltered.filter(r =>
          cleanSpaces(r.sem) === cleanSpaces(targetSem) &&
          (!targetAnio || !r.anio || r.anio === targetAnio)
        );
        scopeLabel = `Semana ${targetSem}${targetAnio ? ' - ' + targetAnio : ''}`;
        document.getElementById('kpiHorasLabel').textContent = `Horas Acumuladas (${scopeLabel})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${scopeLabel})`;
      } else {
        const [targetAnio, targetMesLower] = selectedTemporal.split('||');
        activeData = baseFiltered.filter(r =>
          cleanSpaces(r.mes).toLowerCase() === cleanSpaces(targetMesLower).toLowerCase() &&
          (!targetAnio || !r.anio || r.anio === targetAnio)
        );
        const mesCap = targetMesLower ? targetMesLower.charAt(0).toUpperCase() + targetMesLower.slice(1) : '-';
        scopeLabel = `${mesCap}${targetAnio ? ' ' + targetAnio : ''}`;
        document.getElementById('kpiHorasLabel').textContent = `Horas Acumuladas (${scopeLabel})`;
        document.getElementById('kpiCombLabel').textContent = `Combustible Col. M (${scopeLabel})`;
      }

      document.getElementById('mainChartTitle').textContent = theme.title;
      document.getElementById('activeScopeBadge').textContent = scopeLabel || '-';

      // KPIs (3 principales)
      const totalHoras = activeData.reduce((acc, r) => acc + r.totalHoras, 0);
      const totalComb = activeData.reduce((acc, r) => acc + r.combustible, 0);
      const activeRows = activeData.filter(r => r.totalHoras > 0);
      const uniqueActiveMachines = new Set(activeRows.map(r => r.codigo)).size;

      document.getElementById('kpiHoras').textContent = `${totalHoras.toLocaleString('es-PE', { maximumFractionDigits: 1 })} h`;
      document.getElementById('kpiCombustible').textContent = `${totalComb.toLocaleString('es-PE', { maximumFractionDigits: 1 })} Gal`;
      document.getElementById('kpiEquipos').textContent = uniqueActiveMachines;

      renderMainChart(activeData, theme, selectedEquipo);
    }

    // Dibuja píldoras redondeadas de alta visibilidad para las etiquetas de datos
    function drawPillBadge(ctx, text, centerX, centerY, bgColor, textColor, borderColor = '#ffffff') {
      ctx.save();
      ctx.font = '800 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      const padX = 7;
      const height = 20;
      const textWidth = ctx.measureText(text).width;
      const width = textWidth + padX * 2;
      const x = centerX - width / 2;
      const y = centerY - height / 2;
      const r = 6;

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();

      ctx.fillStyle = bgColor;
      ctx.fill();

      if (borderColor) {
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, centerX, centerY + 0.5);
      ctx.restore();
    }

    const flagAndLabelsPlugin = {
      id: 'flagAndLabelsPlugin',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const theme = PERIOD_THEMES[currentPeriod];
        const numCategories = chart.data.labels.length;

        const barBadgeYMap = new Array(numCategories).fill(null);

        for (let i = 0; i < numCategories; i++) {
          let topY = Infinity;
          let totalH = 0;
          const activeSegments = [];

          chart.data.datasets.forEach((dataset, dsIndex) => {
            if (dataset.type === 'line') return;
            const meta = chart.getDatasetMeta(dsIndex);
            if (meta.hidden) return;

            const val = Number(dataset.data[i] || 0);
            if (val <= 0) return;

            const el = meta.data[i];
            if (!el) return;

            totalH += val;
            if (el.y < topY) topY = el.y;
            activeSegments.push({ val, el });
          });

          // Si trabajó en 2 o más lugares (modo bandera), mostrar solo las horas de cada franja dentro de la barra
          if (activeSegments.length > 1) {
            activeSegments.forEach(({ val, el }) => {
              const segHeight = Math.abs(el.base - el.y);
              if (segHeight >= 15) {
                const segCenterY = (el.base + el.y) / 2;
                const horasStr = `${Number.isInteger(val) ? val : val.toFixed(1)}h`;
                ctx.save();
                ctx.font = '800 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#ffffff';
                ctx.strokeText(horasStr, el.x, segCenterY);
                ctx.fillText(horasStr, el.x, segCenterY);
                ctx.restore();
              }
            });
          }

          // Píldora del total de horas encima de la barra
          if (totalH > 0 && topY < Infinity) {
            const xPos = chart.scales.x.getPixelForValue(i);
            const barBadgeY = Math.max(38, topY - 14);
            barBadgeYMap[i] = barBadgeY;

            const totalStr = `${Number.isInteger(totalH) ? totalH : totalH.toFixed(1)} h`;
            drawPillBadge(ctx, totalStr, xPos, barBadgeY, '#0f172a', '#ffffff', '#ffffff');
          }
        }

        // Píldora de Combustible (Gal) sobre la línea punteada sin colisión
        chart.data.datasets.forEach((dataset, dsIndex) => {
          if (dataset.type !== 'line') return;
          const meta = chart.getDatasetMeta(dsIndex);
          if (meta.hidden) return;

          meta.data.forEach((el, i) => {
            const val = Number(dataset.data[i] || 0);
            if (val <= 0) return;

            const fuelStr = `${Number.isInteger(val) ? val : val.toFixed(1)} Gal`;
            const barBadgeY = barBadgeYMap[i];
            let fuelY = Math.max(13, el.y - 16);

            if (barBadgeY !== null && Math.abs(fuelY - barBadgeY) < 25) {
              fuelY = Math.max(13, barBadgeY - 25);
            }

            drawPillBadge(ctx, fuelStr, el.x, fuelY, theme.lineColor, '#ffffff', '#ffffff');
          });
        });
      }
    };

    function renderMainChart(data, theme, selectedEquipo) {
      if (charts.main) charts.main.destroy();
      const ctx = document.getElementById('mainTimeChart').getContext('2d');

      const targetEquipos = selectedEquipo === 'ALL'
        ? [...ORDEN_EQUIPOS]
        : [selectedEquipo];

      const extraEquipos = [...new Set(data.map(r => normalizeEquipoName(r.equipo)))]
        .filter(eq => selectedEquipo === 'ALL' && !targetEquipos.some(t => t.toLowerCase() === eq.toLowerCase()));

      const orderedEquipos = [...targetEquipos, ...extraEquipos].sort(compareEquipos);

      // Lugares activos (Columna A) para leyenda y barras modo bandera
      const activeLugaresSet = new Set();
      data.forEach(r => {
        if (r.totalHoras > 0) activeLugaresSet.add(r.lugar);
      });

      const lugaresList = activeLugaresSet.size > 0
        ? allLugares.filter(l => activeLugaresSet.has(l))
        : (allLugares.length > 0 ? [allLugares[0]] : ['SIN DATA']);

      const hoursByEquipoLugar = new Map();
      const combByEquipo = new Map();

      orderedEquipos.forEach(eq => {
        hoursByEquipoLugar.set(eq, new Map());
        combByEquipo.set(eq, 0);
      });

      data.forEach(r => {
        const eq = normalizeEquipoName(r.equipo);
        if (!hoursByEquipoLugar.has(eq)) {
          hoursByEquipoLugar.set(eq, new Map());
          combByEquipo.set(eq, 0);
        }
        const lugarMap = hoursByEquipoLugar.get(eq);
        lugarMap.set(r.lugar, (lugarMap.get(r.lugar) || 0) + r.totalHoras);
        combByEquipo.set(eq, (combByEquipo.get(eq) || 0) + r.combustible);
      });

      const barDatasets = lugaresList.map((lugar, idx) => {
        const color = theme.flagColors[idx % theme.flagColors.length];
        return {
          label: lugar,
          data: orderedEquipos.map(eq => {
            const val = hoursByEquipoLugar.get(eq)?.get(lugar) || 0;
            return Number(val.toFixed(1));
          }),
          backgroundColor: color,
          borderColor: '#ffffff',
          borderWidth: 1.5,
          borderRadius: 4,
          stack: 'horas',
          order: 2,
          yAxisID: 'y'
        };
      });

      const fuelDataset = {
        label: 'Combustible Abastecido (Gal)',
        data: orderedEquipos.map(eq => Number((combByEquipo.get(eq) || 0).toFixed(1))),
        type: 'line',
        borderColor: theme.lineColor,
        backgroundColor: theme.lineBg,
        borderWidth: 3,
        borderDash: [10, 6],
        tension: 0.35,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointBackgroundColor: theme.lineColor,
        pointBorderColor: '#ffffff',
        pointBorderWidth: 1.5,
        fill: false,
        order: 1,
        yAxisID: 'y1'
      };

      charts.main = new Chart(ctx, {
        type: 'bar',
        plugins: [flagAndLabelsPlugin],
        data: {
          labels: orderedEquipos,
          datasets: [...barDatasets, fuelDataset]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 56, bottom: 4 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#0f172a',
                font: { size: 12.5, weight: '700' },
                padding: 20,
                usePointStyle: true,
                // Ocultar "Combustible Abastecido (Gal)" de la leyenda inferior y dejar solo los lugares
                filter(legendItem, chartData) {
                  return chartData.datasets[legendItem.datasetIndex].type !== 'line';
                }
              }
            },
            tooltip: {
              backgroundColor: '#0f172a',
              titleFont: { size: 13, weight: '700' },
              bodyFont: { size: 12 },
              padding: 12,
              callbacks: {
                label(context) {
                  const val = context.parsed.y || 0;
                  if (context.dataset.type === 'line') {
                    return ` Combustible Abastecido: ${val.toFixed(1)} Gal`;
                  }
                  if (val <= 0) return null;
                  return ` ${context.dataset.label}: ${val.toFixed(1)} h`;
                },
                footer(tooltipItems) {
                  const totalH = tooltipItems
                    .filter(item => item.dataset.type !== 'line')
                    .reduce((sum, item) => sum + (item.parsed.y || 0), 0);
                  return totalH > 0 ? `Total Horas Equipo: ${totalH.toFixed(1)} h` : '';
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              ticks: {
                color: '#0f172a',
                font: { size: 11, weight: '600' },
                autoSkip: false,
                maxRotation: 45,
                minRotation: 30
              },
              grid: { color: 'rgba(148, 163, 184, 0.25)' }
            },
            y: {
              type: 'linear',
              position: 'left',
              stacked: true,
              beginAtZero: true,
              grace: '20%',
              title: {
                display: true,
                text: 'Horas (h)',
                color: theme.axisLeftColor,
                font: { size: 15, weight: '800' },
                padding: { bottom: 8 }
              },
              ticks: {
                color: '#1e293b',
                font: { size: 13, weight: '700' }
              },
              grid: { color: 'rgba(148, 163, 184, 0.25)' }
            },
            y1: {
              type: 'linear',
              position: 'right',
              beginAtZero: true,
              grace: '20%',
              title: {
                display: true,
                text: 'Combustible (Gal)',
                color: theme.lineColor,
                font: { size: 15, weight: '800' },
                padding: { bottom: 8 }
              },
              ticks: {
                color: '#1e293b',
                font: { size: 13, weight: '700' }
              },
              grid: { drawOnChartArea: false }
            }
          }
        }
      });
    }

    // Event Listeners
    document.querySelectorAll('#periodTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#periodTabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPeriod = btn.dataset.period;
        populateTemporalSelector(false);
        updateDashboard();
      });
    });

    ['filterTemporal', 'filterLugar', 'filterEquipo'].forEach(id => {
      document.getElementById(id).addEventListener('change', updateDashboard);
    });

    // Inicializar
    fetchSheetData();
  </script>
</body>
